<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comite Central - Traductor Morse</title>
</head>
<body>
  <div class="soviet-container">
    <header class="soviet-header">
      <h1>★ COMITÉ CENTRAL DE TELECOMUNICACIONES ★</h1>
      <p>SISTEMA DE CIFRADO Y DESCIFRADO MORSE - GOBIERNO SOVIETICO</p>
    </header>
    <div class="control-group">
      <label for="mode-selector">MODO DE OPERACIÓN:</label>
      <select id="mode-selector">
        <option value="text-to-morse">Texto Común ➔ Código Morse</option>
        <option value="morse-to-text">Código Morse ➔ Texto Común</option>
      </select>
    </div>
    <div class="control-group">
      <label id="input-label" for="input-text">TEXTO COMÚN (MENSAJE OFICIAL):</label>
      <textarea id="input-text" placeholder="Escriba su mensaje en texto plano..."></textarea>
    </div>
    <button id="convert-btn" class="btn-soviet">EJECUTAR TRANSMISIÓN / TRADUCCIÓN</button>
    <div class="control-group" style="margin-top: 15px;">
      <label id="output-label" for="output-text">CÓDIGO MORSE INTERCEPTADO:</label>
      <textarea id="output-text" readonly placeholder="El resultado aparecerá aquí..."></textarea>
    </div>
    <div class="terminal-status">
      <span id="status-log">ESTADO: SISTEMA EN ESPERA DE COMANDO.</span>
    </div>
  </div>
</body>
</html>
